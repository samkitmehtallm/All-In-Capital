name: Drain the application queue

# Serverless cannot hold a worker open, so the schedule lives here and calls the
# route every five minutes. GitHub's scheduler is best-effort and can run late
# under load; the queue tolerates that because nothing expires in it.
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

# One drain at a time. Two overlapping runs would both dequeue, and while the
# visibility timeout makes that safe, it wastes a function invocation.
concurrency:
  group: drain-queue
  cancel-in-progress: false

jobs:
  drain:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Call the cron route
        env:
          APP_URL: ${{ secrets.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          set -euo pipefail
          if [ -z "${APP_URL:-}" ] || [ -z "${CRON_SECRET:-}" ]; then
            echo "APP_URL and CRON_SECRET must be set as repository secrets."
            exit 1
          fi

          body=$(mktemp)
          code=$(curl -sS -o "$body" -w '%{http_code}' --max-time 90 \
            -X POST "$APP_URL/api/cron/queue" \
            -H "Authorization: Bearer $CRON_SECRET")

          echo "HTTP $code"
          cat "$body"
          echo

          # A paused queue (daily spend cap reached) returns 200 and is not a
          # failure. Anything else non-2xx is.
          case "$code" in
            2*) exit 0 ;;
            *) exit 1 ;;
          esac
